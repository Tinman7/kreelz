# On demand (2026-10-30, per David): subtitles check (backfill) and the "today in 3 minutes" digest now, then the
# region edition and the search pages — the same steps the nightly refresh runs, without collecting anything new.
# Cost: CAP_MAX/50 YouTube units (25,000 videos = 500 units) + 1 unit and one small Claude call for the digest.
name: Subtitles + digest now
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Subtitles, digest, pages
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAP_MAX: "25000"
        run: |
          node scripts/captions.mjs index.html | tee extras.log
          node scripts/digest.mjs index.html | tee -a extras.log
          node scripts/region.mjs index.html
          node scripts/seo.mjs || echo "search pages skipped"
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "kreelz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html jp data
          git add -A k sitemap.xml robots.txt
          git commit -m "Subtitles check + today in 3 minutes $(grep -o '"with_captions":[0-9]*' extras.log | tail -1)" || echo "nothing to commit"
          git pull --rebase -q
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          tail -20 extras.log
