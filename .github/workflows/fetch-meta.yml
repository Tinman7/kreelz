name: Fetch video metadata

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/fetch_meta.mjs index.html data/vmeta.json.gz | tee meta.log
      - name: Commit
        run: |
          git config user.name "kreelz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vmeta.json.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Video metadata: $(tail -1 meta.log)"
          git pull --rebase -q
          git push
