# One-time (2026-11-04): applies tonight what David asked for in the evening of 2026-11-03, after the nightly build that had
# already started at 20:24 KST without it: clips that can't play taken off (whole site once), the "today" pages with
# 50 clips explained + what Korean viewers say, the new search pages (members, more groups and actors, dramas, Spanish),
# and every NAVER Clip clip taken off both editions.
# Runs once after the 00:00 publish (schedule below, guarded to 2026-11-04 KST); from the next night the nightly does all of it.
name: After the nightly build
on:
  workflow_dispatch:
  schedule:
    - cron: "25 15 3 11 *"   # 2026-11-04 00:25 KST
permissions:
  contents: write
  pages: write
concurrency:
  group: after-build
  cancel-in-progress: false
jobs:
  after:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply after the 00:00 publish
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(TZ=Asia/Seoul date +%F)" = "2026-11-04" ] || { echo "one-time job, not today"; exit 0; }
          # wait (up to 40 min) until the 2026-11-04 build is on main
          for i in $(seq 1 40); do git pull -q --rebase; grep -q 'const FEED_BUILT = "2026-11-04"' index.html && break; echo "waiting for the build…"; sleep 60; done
          grep -q 'const FEED_BUILT = "2026-11-04"' index.html || { echo "build not there, nothing done"; exit 0; }
          git config user.name "kreelz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # NAVER Clip off both editions, shorts and videos (per David 2026-11-03 23:00); its 6-hourly search is disabled
          node -e 'require("fs").writeFileSync("nclip.js","window.NCLIP="+JSON.stringify({built:new Date().toISOString(),items:[],off:"2026-11-03 per David"})+";\n")'
          timeout 25m node scripts/play_check.mjs index.html bad_play.json --all || echo "[]" > bad_play.json
          python3 scripts/drop_ids.py index.html bad_play.json index.next.html && grep -q 'const SHORTS = "' index.next.html && mv index.next.html index.html
          node scripts/digest.mjs index.html || echo "digest skipped"
          node scripts/region.mjs index.html
          node scripts/seo.mjs || echo "search pages skipped"
          git add index.html data jp nclip.js
          git add -A k es sitemap.xml robots.txt
          git commit -m "2026-11-04 build: unplayable clips off, 50 clips explained with Korean reactions, new search pages (per David 2026-11-03)" || exit 0
          git pull --rebase -q && git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
