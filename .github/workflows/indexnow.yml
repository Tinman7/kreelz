# IndexNow ping (Bing, Naver, Yandex, Seznam): by hand, and called by the nightly after its publish. See scripts/indexnow.mjs.
name: IndexNow
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          sleep 90   # give GitHub Pages a moment to serve the new pages
          K=$(ls [0-9a-f]*.txt | head -1); echo "key file: https://kreelz.com/$K → $(curl -s -o /dev/null -w '%{http_code}' https://kreelz.com/$K)"
          node scripts/indexnow.mjs
