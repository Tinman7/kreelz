name: Translate all titles

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Titles and translations for every video on the site
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TX_MINUTES: "170"
        run: node scripts/titles.mjs index.html | tee tx.log
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "kreelz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add t
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Titles in every language: $(tail -1 tx.log | head -c 400)"
          git pull --rebase -q
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
