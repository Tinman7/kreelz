name: Translate all titles

on:
  workflow_dispatch:
    inputs:
      passes:
        description: "ja = Japanese only (kreelz.com/jp); all = Japanese, then en/tl/th/id/es"
        default: "ja"
        type: choice
        options: [ja, all]
      minutes:
        description: "translation time limit (minutes)"
        default: "170"

permissions:
  contents: write
  pages: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Titles and translations for every video on the site
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TX_MINUTES: ${{ inputs.minutes }}
          TX_PAR: "10"
          TX_PASSES: ${{ inputs.passes }}
        run: node scripts/titles.mjs index.html 2>&1 | tee tx.log
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "kreelz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add t
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Titles in every language: $(tail -1 tx.log | head -c 400)"
          git pull --rebase -q
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
      - name: Log (branch tx-log)
        if: always()
        run: |
          cp tx.log /tmp/tx.log 2>/dev/null || echo "no log" > /tmp/tx.log
          git config user.name "kreelz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash -q -u || true
          git checkout -q --orphan tx-log && git rm -rfq . && cp /tmp/tx.log tx.log
          git add tx.log && git commit -qm "translate log" && git push -qf origin tx-log
