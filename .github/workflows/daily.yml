name: Nightly refresh (00:00 KST)

# New content goes live only at exactly 00:00:00 KST. GitHub often starts scheduled jobs hours late, so the job starts
# early in the evening (several starts, in case some are late or skipped), collects and builds everything with hours
# to spare, then waits and publishes at 00:00:00 KST. A daily Claude scheduled task also starts it (workflow_dispatch,
# publish=midnight) as a backstop. The first start that runs does the day; later ones see it is done and stop.
# The 00:20 start is the last safety net: if nothing ran before midnight it publishes as soon as it is ready.
on:
  schedule:
    - cron: "0 10 * * *"    # 19:00 KST
    - cron: "0 11 * * *"    # 20:00 KST
    - cron: "0 12 * * *"    # 21:00 KST
    - cron: "0 13 * * *"    # 22:00 KST
    - cron: "0 14 * * *"    # 23:00 KST
    - cron: "20 15 * * *"   # 00:20 KST (publishes at once if nothing ran before midnight)
  workflow_dispatch:
    inputs:
      publish:
        description: "midnight = build now, go live at the next 00:00 KST; now = go live as soon as built"
        default: "midnight"
        type: choice
        options: [midnight, now]

permissions:
  contents: write
  pages: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # GitHub maximum is 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest main, not the commit from when this start was queued, so a start that waited
                      # behind an earlier run sees that the day is already done and stops instead of failing

      - name: Which day is this refresh for?
        id: day
        run: |
          # the KST date this refresh goes live on: tomorrow when started from noon on, today when started after midnight
          BUILD=$(TZ=Asia/Seoul date -d '+12 hours' +%F)
          WAIT=1
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "now" ]; then BUILD=$(TZ=Asia/Seoul date +%F); WAIT=0; fi
          echo "wait=$WAIT" >> "$GITHUB_OUTPUT"
          CUR=$(grep -o 'const FEED_BUILT = "[^"]*"' index.html | cut -d'"' -f2)
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "weekday=$(date -d "$BUILD" +%u)" >> "$GITHUB_OUTPUT"
          if [ "$CUR" = "$BUILD" ] && [ "$WAIT" = "1" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Already refreshed for $BUILD"; fi
          # a job may run at most 6 hours, so a start more than 5.5 hours before midnight leaves it to a later start
          LEFT=$(( $(TZ=Asia/Seoul date -d "$BUILD 00:00:00" +%s) - $(date +%s) ))
          if [ "$WAIT" = "1" ] && [ "$LEFT" -gt 19800 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Too early (${LEFT}s before midnight), a later start will do it"; fi
          echo "Refresh for $BUILD (site currently $CUR)"

      - uses: actions/setup-node@v4
        if: steps.day.outputs.skip != '1'
        with:
          node-version: "20"

      - name: Collect from YouTube Data API
        if: steps.day.outputs.skip != '1'
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/collect.mjs scripts/channels.json daily.json

      - name: Fan videos (boy-group performance fancams first; covers and fan edits of the priority artists)
        if: steps.day.outputs.skip != '1'
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          FAN_SEARCHES: "22"
        run: node scripts/fans.mjs fans.json

      - name: Priority idols on interviews (Korea and overseas), TV / variety shows and award shows
        if: steps.day.outputs.skip != '1'
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          IDOL_SHOW_SEARCHES: "10"
        run: node scripts/idol_shows.mjs idol_shows.json

      - name: Focus actors (young male leads popular in SEA), romance first
        if: steps.day.outputs.skip != '1'
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          ACTOR_SEARCHES: "10"
        run: node scripts/actor_videos.mjs actors.json

      - name: Fancams of the focus actors (fan meetings, events, airport, concerts), top priority
        if: steps.day.outputs.skip != '1'
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          ACTOR_MODE: fancam
          ACTOR_SEARCHES: "20"
        run: node scripts/actor_videos.mjs actor_fancams.json

      - name: Popular videos from individual creators, every category
        if: steps.day.outputs.skip != '1'
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          CREATOR_SEARCHES: "10"
        run: node scripts/creators.mjs creators.json

      - name: OTT official channels catch-up (Netflix, TVING, Disney+, Coupang Play, wavve)
        if: steps.day.outputs.skip != '1'
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/backfill.mjs ott.json UCNIiH_4ArJNd_cDZApZ7AFg:300 UCiEEF51uRAeZeCo8CJFhGWw:300 UCtdz9LWNNQKUg4Xpma_40Ug:300 UCjn-VbcIkAeXQKCmLJV8YwQ:300 UCpiCK8c6PBktcxq7Az_t4RQ:300 UCym5538xAEEppbridXozfgw:300

      - name: One-time catch-up of SEVENTEEN's official channel (added to the Music priority list on 2026-10-23)
        if: steps.day.outputs.skip != '1' && steps.day.outputs.build == '2026-10-24'
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/backfill.mjs seventeen.json UCfkXDY7vwkcJ8ddFGz8KusA:400

      - name: Merge into site
        if: steps.day.outputs.skip != '1'
        run: |
          [ -s daily.json ] || echo '{"videos":{},"shorts":{}}' > daily.json
          python3 scripts/daily_merge.py index.html daily.json "${{ steps.day.outputs.build }}" index.next.html | tee merge.log
          grep -q 'const FEED = "' index.next.html
          grep -q 'const SHORTS = "' index.next.html
          mv index.next.html index.html
          for extra in fans.json ott.json creators.json actors.json actor_fancams.json seventeen.json idol_shows.json; do
            if [ -s "$extra" ]; then
              python3 scripts/daily_merge.py index.html "$extra" "${{ steps.day.outputs.build }}" index.next.html | tee -a merge.log
              grep -q 'const SHORTS = "' index.next.html && mv index.next.html index.html
            fi
          done
          node scripts/prio.mjs index.html data/vmeta.json.gz

      - name: TikTok shorts added on the admin page
        if: steps.day.outputs.skip != '1'
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/tiktok.mjs index.html

      - name: Weekly thumbnail check (Monday's refresh)
        if: steps.day.outputs.skip != '1' && steps.day.outputs.weekday == '1'
        continue-on-error: true
        timeout-minutes: 40
        run: |
          node scripts/thumb_audit.mjs index.html bad.json
          python3 scripts/drop_ids.py index.html bad.json index.next.html && mv index.next.html index.html

      - name: Statistics for the admin page
        if: steps.day.outputs.skip != '1'
        continue-on-error: true
        run: node scripts/catalog_stats.mjs index.html daily.json fans.json ott.json creators.json actors.json actor_fancams.json seventeen.json idol_shows.json

      - name: Titles in every language
        if: steps.day.outputs.skip != '1'
        continue-on-error: true
        timeout-minutes: 30
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TX_MINUTES: "20"
        run: node scripts/titles.mjs index.html

      - name: Commit
        if: steps.day.outputs.skip != '1'
        run: |
          git config user.name "kreelz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data stats
          [ -d t ] && git add t
          git commit -m "Refresh for ${{ steps.day.outputs.build }} $(head -c 300 merge.log)" || echo "nothing to commit"

      - name: Wait for 00:00 KST
        if: steps.day.outputs.skip != '1' && steps.day.outputs.wait == '1'
        run: |
          now=$(date +%s); target=$(TZ=Asia/Seoul date -d "${{ steps.day.outputs.build }} 00:00:00" +%s)
          wait=$(( target - now ))
          echo "now $(TZ=Asia/Seoul date '+%F %T') KST, waiting ${wait}s"
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi

      - name: Publish
        if: steps.day.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase -q
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          echo "published at $(TZ=Asia/Seoul date '+%F %T') KST"
