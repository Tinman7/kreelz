# On demand: run only what has not run yet on kreelz.com/jp (new channels and the first run of new search groups) and
# publish right away — for changes David wants "now" instead of at the next 00:00 refresh (added 2026-10-29).
# Cost: each new search group's first run (100 YouTube units a search) plus video details.
name: JP new groups now
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  top:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect only what has not run yet (new channels and search groups)
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          JP_NEW_ONLY: "1"
        run: node scripts/japan.mjs jp_new.json | tee new.log
      - name: Merge into site (same build day, no ageing)
        run: |
          BUILT=$(grep -o 'const FEED_BUILT = "[^"]*"' index.html | cut -d'"' -f2)
          if [ -s jp_new.json ]; then
            python3 scripts/daily_merge.py index.html jp_new.json "$BUILT" index.next.html | tee -a new.log
            grep -q 'const SHORTS = "' index.next.html && mv index.next.html index.html
          fi
          node scripts/prio.mjs index.html data/vmeta.json.gz | tee -a new.log
      - name: Japanese titles for the new videos
        continue-on-error: true
        timeout-minutes: 12
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TX_MINUTES: "8"
          TX_PASSES: "ja"
        run: node scripts/titles.mjs index.html
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "kreelz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/region.mjs index.html
          git add index.html data jp scripts/jp_channels.json
          [ -d t ] && git add t
          git commit -m "kreelz.com/jp K-Travel & Food: new groups now (survey places, cooking classes, experiences, hiking, FOXandBEAR, ...) $(grep -o '"videos":[0-9]*,"shorts":[0-9]*' new.log | tail -1)" || echo "nothing to commit"
          git pull --rebase -q
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          cat new.log | tail -40
