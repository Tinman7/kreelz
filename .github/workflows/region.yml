name: Region editions (kreelz.com/jp)

# kreelz.com/jp is generated from index.html. When index.html changes by a normal push (UI fixes etc.), rebuild it.
# The nightly refresh rebuilds it itself (pushes made by workflows do not start other workflows).
on:
  push:
    branches: [main]
    paths: [index.html, scripts/region.mjs]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: region
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build region editions
        run: node scripts/region.mjs index.html
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "kreelz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jp
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Region editions rebuilt from index.html"
          git pull --rebase -q && git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
