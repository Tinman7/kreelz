name: Japan channels check

# Finds the Japanese channels listed in scripts/jp_channels.json and shows (in the log) what the nightly refresh would
# collect from them for kreelz.com/jp. Writes no site data; only the channel ids it found are saved.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          set -o pipefail
          node scripts/japan.mjs --check 2>&1 | tee jp_check.log
          echo "---- konbini (global) ----" >> jp_check.log
          node scripts/konbini.mjs --check 2>&1 | tee -a jp_check.log
      - name: Save the channel ids
        run: |
          git config user.name "kreelz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/jp_channels.json
          git commit -m "Japan channels found" || echo "nothing new"
          git pull --rebase -q && git push
      - name: Report (branch jp-check)
        if: always()
        run: |
          git config user.name "kreelz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/r && cp jp_check.txt jp_check.log /tmp/r/ 2>/dev/null || true
          git checkout -q --orphan jp-check && git rm -rfq . && cp /tmp/r/* . 2>/dev/null || true
          git add -A && git commit -qm "Japan channels check report" && git push -qf origin jp-check
