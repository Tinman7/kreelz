name: Backfill priority artists

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect priority artist channels
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: >
          node scripts/backfill.mjs backfill.json
          UC9rMiEjNaCSsebs31MRDCRA:600
          UCgQ7HPx1qcmH9_lPTlWOnQw:all
          UC2e4Ukj5Pfr7cb3KpJAFBdQ:600
          @KATSEYE:600:KATSEYE
          | tee backfill.log
      - name: Merge and prioritise
        run: |
          BUILD=$(grep -o 'const FEED_BUILT = "[^"]*"' index.html | cut -d'"' -f2)
          python3 scripts/daily_merge.py index.html backfill.json "$BUILD" index.next.html | tee merge.log
          grep -q 'const SHORTS = "' index.next.html
          mv index.next.html index.html
          node scripts/prio.mjs index.html data/vmeta.json.gz | tee prio.log
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "kreelz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data scripts/artist_channels.json scripts/channels.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "HYBE/BTS backfill: $(tail -1 backfill.log) $(cat prio.log)"
          git pull --rebase -q
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
